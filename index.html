<style>

main{max-width:480px;margin:0 auto;padding:12px 12px 40px}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tabs button{flex:1 1 30%;padding:11px 3px;border-radius:10px;border:1px solid #5a37a0;background:#25124a;color:#e9dcff;font:700 13px Roboto,'Noto Sans Ethiopic',sans-serif;cursor:pointer}.tabs button[aria-pressed=true]{background:linear-gradient(135deg,#f6d77a,var(--g2));color:#2a0f55}

div.cell{cursor:default}.cell.on,.cell.free{background:linear-gradient(135deg,#a855f7,#6d28d9);box-shadow:inset 0 0 0 2px var(--gold)}.cell.free{color:#f6d77a;cursor:default}

#msg{text-align:center;font-weight:700;min-height:22px;margin:8px 0;color:#ff9ab0}

function evalSlotsBoard(grid,bet){

  var magWin=0;
  if(mags>0&&coins.length>0){coins.forEach(function(cn){magWin+=slCoinVal(cn.v,bet)*mags});magWin=Math.round(magWin*100)/100;win+=magWin}
  return {lineWin:Math.round((win-magWin)*100)/100,magWin:magWin,baseWin:Math.round(win*100)/100,coins:coins,mags:mags,winCells:winCells,winLines:winLines}
}

["When the room countdown ends, the game starts for everyone. A room needs at least 2 players, otherwise all stakes are refunded.","የክፍሉ ቆጠራ ሲያበቃ ጨዋታው ለሁሉም ይጀምራል። አንድ ክፍል ቢያንስ 2 ተጫዋቾች ያስፈልገዋል፣ አለበለዚያ ሁሉም ገንዘብ ይመለሳል።","ቆጸራ ክፍሊ ምስ ተወዲአ እቲ ጸወታ ንኹሉ ይጅምር። ሓደ ክፍሊ እንተወሓደ 2 ተጻዋትቲ የድልዮ፣ እንተዘይኮይኑ ኩሉ ገንዘብ ይምለስ።"],
["Numbers are called every 5 seconds. Tap called numbers on your card, or use Auto-mark.","ቁጥሮች በየ5 ሰከንድ ይጠራሉ። በካርድዎ ላይ የተጠሩትን ቁጥሮች ይንኩ፣ ወይም ራስ-ሰር ምልክትን ይጠቀሙ።","ቁጽርታት ኣብ ነፍሲ ወከፍ 5 ሰከንድ ይጽዋዑ። ኣብ ካርድኩም ዝተጸዋዑ ቁጽርታት ጠውቑ፣ ወይ ባዕሉ ምልክት ምግባር ተጠቀሙ።"],
