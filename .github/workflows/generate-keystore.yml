name: Generate Keystore Once
on: workflow_dispatch
jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Create Keystore & Print Base64
        run: |
          keytool -genkey -v -keystore yeme-bingo.jks -keyalg RSA -keysize 2048 -validity 10000 -alias yeme-key \
            -storepass YemeBingo2026 -keypass YemeBingo2026 \
            -dname "CN=YemeBingo, OU=Dev, O=YemeBingo, L=Mekelle, S=Tigray, C=ET"
          echo "=== COPY THE LINE BELOW ==="
          base64 -w 0 yeme-bingo.jks
          echo ""
