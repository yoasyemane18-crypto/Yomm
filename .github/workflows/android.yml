name: Android CI & APK Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify web and Android asset index.html match
        run: cmp -s index.html app/src/main/assets/index.html

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build and sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/app/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$KEYSTORE_PATH"
            ls -lh "$KEYSTORE_PATH"
          fi
          gradle assembleRelease
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$KEYSTORE_PATH" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets must all be set when KEYSTORE_BASE64 is configured."
              exit 1
            fi
            BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
            "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_PATH" "${APK_PATH}.aligned"
            mv "${APK_PATH}.aligned" "$APK_PATH"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$APK_PATH" \
              "$APK_PATH"
            "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set; falling back to debug signing."
          fi

      - name: Clean up decoded keystore
        if: always()
        run: rm -f app/release-keystore.jks

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yeme-bingo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
